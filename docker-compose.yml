services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindloom
      POSTGRES_USER: mindloom
      POSTGRES_PASSWORD: mindloom_local_dev
    ports:
      - "5432:5432"
    volumes:
      - mindloom-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindloom -d mindloom"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mindloom-postgres:
